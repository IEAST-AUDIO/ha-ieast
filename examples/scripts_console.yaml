script:
  ieast_console_http:
    alias: '[iEAST控制台] HTTP 命令直发'
    description: 向设备直发 httpapi 命令, 响应写入日志(追踪可见)。
    fields:
      entity_id:
        description: 目标播放器
        example: media_player.room1
        selector:
          entity:
            integration: ieast
            domain: media_player
      command:
        description: httpapi 命令, 如 getStatusEx / setPlayerCmd:vol:30
        example: getPlayerStatus
        selector:
          text: null
    sequence:
    - action: ieast.send_http_command
      data:
        entity_id: '{{ entity_id }}'
        command: '{{ command }}'
      response_variable: device_response
    - action: system_log.write
      data:
        level: info
        message: '[iEAST控制台] {{ entity_id }} HTTP {{ command }} => {{ device_response
          }}

          '
  ieast_console_tcp:
    alias: '[iEAST控制台] TCP 8899 命令直发'
    description: 直发 TCP 8899 MCU 透传指令(预设/触发/勿扰/指示灯等), 帧模式可选。
    fields:
      entity_id:
        description: 目标播放器
        example: media_player.room1
        selector:
          entity:
            integration: ieast
            domain: media_player
      command:
        description: MCU 透传指令, 如 MCU+PAS+MTE& / MCU+KEY+x01&
        example: MCU+PAS+MTE&
        selector:
          text: null
      frame_mode:
        description: 帧模式(auto 先 token 后 doc)
        example: auto
        selector:
          select:
            options:
            - auto
            - token
            - doc
    sequence:
    - action: ieast.send_tcp_command
      data:
        entity_id: '{{ entity_id }}'
        command: '{{ command }}'
        frame_mode: '{{ frame_mode | default(''auto'') }}'
      response_variable: device_response
    - action: system_log.write
      data:
        level: info
        message: '[iEAST控制台] {{ entity_id }} TCP {{ command }} ({{ frame_mode | default(''auto'')
          }}) => {{ device_response }}

          '
