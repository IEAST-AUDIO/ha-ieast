party_mode:
  name: 全屋齐播
  description: 把所有(或指定)的 iEAST 播放器加入主机分组, 一次指令全屋同播。
  fields:
    master:
      name: 主机
      description: 作为分组主机的播放器。
      required: true
      example: media_player.living_room
      selector:
        entity:
          integration: ieast
          domain: media_player
    members:
      name: 成员
      description: 要加入的播放器列表; 留空表示除主机外的全部 iEAST 播放器。
      required: false
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player

ungroup_all:
  name: 全部解组
  description: 解散所有 iEAST 分组, 恢复各房间独立播放。

save_snapshot:
  name: 保存播放快照
  description: 保存播放器的音量/静音/音源/播放状态, 供 restore_snapshot 恢复(适合 TTS 插播场景)。
  fields:
    entity_id:
      name: 播放器
      description: 要保存快照的播放器。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player

restore_snapshot:
  name: 恢复播放快照
  description: 恢复之前用 save_snapshot 保存的状态。
  fields:
    entity_id:
      name: 播放器
      description: 要恢复快照的播放器。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player

send_http_command:
  name: 发送 HTTP 命令
  description: 直接向设备发送 httpapi 命令(调试/高级用法), 返回设备应答。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    command:
      name: 命令
      description: 例如 getStatusEx / getPlayerStatus / setPlayerCmd:vol:30
      required: true
      example: getPlayerStatus
      selector:
        text:

send_tcp_command:
  name: 发送 TCP 命令
  description: 直接发送 TCP 8899 MCU 透传指令(调试/高级用法), 返回应答帧。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    command:
      name: 命令
      description: 例如 MCU+PAS+MTE& / MCU+KEY+x01&
      required: true
      example: "MCU+PAS+MTE&"
      selector:
        text:
    frame_mode:
      name: 帧模式
      description: token=ProConsole 同款; doc=官方文档校验和; auto=先 token 后 doc。
      required: false
      selector:
        select:
          options:
            - label: 自动
              value: auto
            - label: Token(实机)
              value: token
            - label: Checksum(文档)
              value: doc

announce:
  name: 插播呼叫
  description: 快照当前播放状态 -> (可选临时入组) -> 播报 TTS/音频 -> 恢复原状态。
  fields:
    targets:
      name: 目标房间
      description: 要插播的播放器列表。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
    message:
      name: 播报文本
      description: TTS 播报内容; 需同时提供 TTS 平台。
      required: false
      example: 晚餐好了
      selector:
        text:
    tts_platform:
      name: TTS 平台
      description: 如 google_translate / cloud / microsoft / edge_tts。
      required: false
      example: google_translate
      selector:
        text:
    media_url:
      name: 音频 URL
      description: 直接播放的音频/门铃音 URL(或 media-source:// URI)。
      required: false
      selector:
        text:
    group:
      name: 临时入组
      description: 多目标时先临时加入第一个目标的分组, 播完自动解散。
      required: false
      default: false
      selector:
        boolean:
    restore:
      name: 恢复原状态
      required: false
      default: true
      selector:
        boolean:
    duration:
      name: 播报时长(秒)
      description: 播报开始到恢复快照的等待时间。
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: 秒

page:
  name: 开始实时广播
  description: 目标房间临时加入主机分组, 主机切换到 AUX(line-in) 实时转播(呼叫台/麦克风接主机 AUX)。
  fields:
    master:
      name: 主机(呼叫台)
      description: AUX 接呼叫麦克风/呼叫台的播放器。
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    targets:
      name: 目标房间
      description: 参与广播的房间; 留空为除主机外全部。
      required: false
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player

page_end:
  name: 结束实时广播
  description: 解散广播分组并恢复各房间广播前的状态。
  fields:
    master:
      name: 主机
      description: 可省略, 自动使用当前广播的主机。
      required: false
      selector:
        entity:
          integration: ieast
          domain: media_player

dsp_param_set:
  name: DSP 参数设置
  description: 设置 BP10 DSP 参数(原始寄存器值 0-255)。参数名支持友好名或 g<组>i<项>。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    param:
      name: 参数名
      description: bass_boost / treble_boost / maxx3d / dialog_center / balance / g0i0 等。
      required: true
      example: bass_boost
      selector:
        text:
    value:
      name: 值(0-255)
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 255

dsp_param_get:
  name: DSP 参数查询
  description: 查询 BP10 DSP 参数当前值(返回响应)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    param:
      name: 参数名
      required: true
      example: bass_boost
      selector:
        text:

dsp_group_reset:
  name: DSP 组复位
  description: 复位某 DSP 参数组为出厂默认(0=MaxxBass 1=MaxxTreble 2=Maxx3D 3=Dialog 4=MaxxVolume 5=Leveler 6=Balance)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    group:
      name: 组号(0-6)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 6

peq_set:
  name: PEQ 段设置
  description: "设置一段 PEQ 的任意参数子集(物理值 Hz/dB/Q), 立即热写 DSP 并落盘。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    band:
      name: 段号(1-12)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 12
    freq:
      name: 频点(Hz)
      required: false
      example: 1000
      selector:
        number:
          min: 16
          max: 24000
          unit_of_measurement: Hz
    gain:
      name: 增益(dB)
      required: false
      example: 3.5
      selector:
        number:
          min: -12
          max: 12
          step: 0.1
          unit_of_measurement: dB
    q:
      name: Q 值
      required: false
      example: 0.7
      selector:
        number:
          min: 0.4
          max: 3
          step: 0.01
    ptype:
      name: 滤波器类型
      required: false
      selector:
        select:
          options:
            - label: Bell(钟形)
              value: 0
            - label: LowShelf(低架)
              value: 1
            - label: HighShelf(高架)
              value: 2

peq_get:
  name: PEQ 段查询
  description: 查询一段 PEQ 的当前参数(返回响应)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    band:
      name: 段号(1-12)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 12

peq_reset:
  name: PEQ 恢复默认
  description: 恢复当前音箱类型的默认 PEQ。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

dsp_diag:
  name: DSP 诊断
  description: "读取 DSP 状态诊断(DPST): 运行状态/DPU 加载/脏标记/错误码。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

dsp_raw:
  name: DSP 原始命令
  description: 发送任意 MCU+PAS+ 透传命令(调试), 返回设备应答。如 PEQC / DPST / SPK。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    command:
      name: 命令
      description: 不带 MCU+PAS+ 前缀, 如 PEQC 或 DPST。
      required: true
      example: PEQC
      selector:
        text:

dsp_scheme_list:
  name: 方案库槽位查询
  description: "查询音效方案库(SCH)槽位占用: 返回 9 个槽位 ID, 空槽显示为空。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    speaker:
      name: 音箱编号(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9

dsp_scheme_upload:
  name: 方案库上传
  description: 上传 128B 方案数据(hex 256 字符, 来自 ProConsole/调音工具导出)到指定槽位。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    speaker:
      name: 音箱编号(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
    slot:
      name: 槽位(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
    data:
      name: 方案数据(hex)
      description: 128B 方案内容的 256 个 hex 字符。
      required: true
      selector:
        text:
          multiline: true

dsp_scheme_apply:
  name: 方案库应用
  description: 应用指定槽位的音效方案到当前音箱。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    speaker:
      name: 音箱编号(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
    slot:
      name: 槽位(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9

dsp_scheme_delete:
  name: 方案库删除
  description: 删除指定槽位的音效方案(使用 DPX, 安全)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    speaker:
      name: 音箱编号(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
    slot:
      name: 槽位(1-9)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9

dsp_pack_export:
  name: 参数包导出
  description: "把本机调好的全部音效参数(PK)导出为参数包文件, 存到 config/ieast_dsp_packs/。"
  fields:
    entity_id:
      name: 播放器(金样机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    filename:
      name: 文件名
      description: 缺省按 机型_family_时间戳 自动命名。
      required: false
      example: golden_living.pkpack
      selector:
        text:

dsp_pack_import:
  name: 参数包导入
  description: 把参数包文件(位于 config/ieast_dsp_packs/)写入本机, family 不一致自动拒绝。
  fields:
    entity_id:
      name: 播放器(新机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    filename:
      name: 文件名
      required: true
      example: golden_living.pkpack
      selector:
        text:

stereo_pair_create:
  name: 创建立体声对
  description: "两台设备组成 L/R 立体声对: 右声道加入左声道分组, 并统一音量、设置声道。"
  fields:
    left:
      name: 左声道(主机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    right:
      name: 右声道(从机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

stereo_pair_remove:
  name: 拆散立体声对
  description: "解除立体声对: 解组并恢复两台设备为立体声输出。"
  fields:
    left:
      name: 左声道(主机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    right:
      name: 右声道
      description: 一般可省略, 自动使用配对记录。
      required: false
      selector:
        entity:
          integration: ieast
          domain: media_player

scan_device:
  name: 全量探测设备
  description: "开发者取证: 一次性返回设备信息/播放状态/EQ/DSP能力(PEQC/DPST/PKI/DPEA)/分组, 带响应。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

dsp_scheme_capture:
  name: 方案捕获
  description: "把当前 PEQ+DPU+DPE 状态合成为 128B 方案 hex(只返回不下发, 上传前请与 ProConsole 导出比对)。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

alarm_set:
  name: 闹钟设置
  description: "设置/取消设备闹钟(最多 3 组)。时间为设备侧时间, 先执行'时间同步'按钮校准。"
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    index:
      name: 闹钟编号(0-2)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 2
    enable:
      name: 启用
      required: false
      default: true
      selector:
        boolean:
    trigger:
      name: 重复方式
      required: false
      selector:
        select:
          options:
            - label: 单次
              value: once
            - label: 每天
              value: daily
            - label: 每周
              value: weekly
    time:
      name: 时间(HH:MM)
      description: 设备侧时间。
      required: false
      example: "07:30"
      selector:
        text:
    date:
      name: 单次日期(YYYYMMDD)
      description: trigger=once 时必填。
      required: false
      example: "20260924"
      selector:
        text:
    weekdays:
      name: 周几(0=周日)
      description: trigger=weekly 时生效, 如 [1,2,3,4,5]。
      required: false
      example: "[1,2,3,4,5]"
      selector:
        object:
    url:
      name: 铃声 URL
      description: 留空为默认铃声。
      required: false
      selector:
        text:

alarm_get:
  name: 闹钟查询
  description: 查询指定编号闹钟的配置(带响应)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    index:
      name: 闹钟编号(0-2)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 2

alarm_stop:
  name: 闹钟止铃
  description: 停止当前正在响的闹钟。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player

group_volume:
  name: 分组批量音量
  description: 主机+全部从机音量/静音一次到位(带响应, 报告每台结果)。
  fields:
    entity_id:
      name: 主机播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    volume:
      name: 音量(0-100)
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 100
    mute:
      name: 静音
      required: false
      selector:
        boolean:
