party_mode:
  name: 全屋齐播
  description: 把所有(或指定)的 iEAST 播放器加入主机分组, 一次指令全屋同播。
  fields:
    master:
      name: 主机
      description: 作为分组主机的播放器。
      required: true
      example: media_player.living_room
      selector:
        entity:
          integration: ieast
          domain: media_player
    members:
      name: 成员
      description: 要加入的播放器列表; 留空表示除主机外的全部 iEAST 播放器。
      required: false
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
ungroup_all:
  name: 全部解组
  description: 解散所有 iEAST 分组, 恢复各房间独立播放。
save_snapshot:
  name: 保存播放快照
  description: 保存播放器的音量/静音/音源/播放状态, 供 restore_snapshot 恢复(适合 TTS 插播场景)。
  fields:
    entity_id:
      name: 播放器
      description: 要保存快照的播放器。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
restore_snapshot:
  name: 恢复播放快照
  description: 恢复之前用 save_snapshot 保存的状态。
  fields:
    entity_id:
      name: 播放器
      description: 要恢复快照的播放器。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
send_http_command:
  name: 发送 HTTP 命令
  description: 直接向设备发送 httpapi 命令(调试/高级用法), 返回设备应答。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    command:
      name: 命令
      description: 例如 getStatusEx / getPlayerStatus / setPlayerCmd:vol:30
      required: true
      example: getPlayerStatus
      selector:
        text: null
send_tcp_command:
  name: 发送 TCP 命令
  description: 直接发送 TCP 8899 MCU 透传指令(调试/高级用法), 返回应答帧。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    command:
      name: 命令
      description: 例如 MCU+PAS+MTE& / MCU+KEY+x01&
      required: true
      example: MCU+PAS+MTE&
      selector:
        text: null
    frame_mode:
      name: 帧模式
      description: token=ProConsole 同款; doc=官方文档校验和; auto=先 token 后 doc。
      required: false
      selector:
        select:
          options:
          - label: 自动
            value: auto
          - label: Token(实机)
            value: token
          - label: Checksum(文档)
            value: doc
announce:
  name: 插播呼叫
  description: 快照当前播放状态 -> (可选临时入组) -> 播报 TTS/音频 -> 恢复原状态。
  fields:
    targets:
      name: 目标房间
      description: 要插播的播放器列表。
      required: true
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
    message:
      name: 播报文本
      description: TTS 播报内容; 需同时提供 TTS 平台。
      required: false
      example: 晚餐好了
      selector:
        text: null
    tts_platform:
      name: TTS 平台
      description: 如 google_translate / cloud / microsoft / edge_tts。
      required: false
      example: google_translate
      selector:
        text: null
    media_url:
      name: 音频 URL
      description: 直接播放的音频/门铃音 URL(或 media-source:// URI)。
      required: false
      selector:
        text: null
    group:
      name: 临时入组
      description: 多目标时先临时加入第一个目标的分组, 播完自动解散。
      required: false
      default: false
      selector:
        boolean: null
    restore:
      name: 恢复原状态
      required: false
      default: true
      selector:
        boolean: null
    duration:
      name: 播报时长(秒)
      description: 播报开始到恢复快照的等待时间。
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: 秒
page:
  name: 开始实时广播
  description: 目标房间临时加入主机分组, 主机切换到 AUX(line-in) 实时转播(呼叫台/麦克风接主机 AUX)。
  fields:
    master:
      name: 主机(呼叫台)
      description: AUX 接呼叫麦克风/呼叫台的播放器。
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    targets:
      name: 目标房间
      description: 参与广播的房间; 留空为除主机外全部。
      required: false
      selector:
        entity:
          multiple: true
          integration: ieast
          domain: media_player
page_end:
  name: 结束实时广播
  description: 解散广播分组并恢复各房间广播前的状态。
  fields:
    master:
      name: 主机
      description: 可省略, 自动使用当前广播的主机。
      required: false
      selector:
        entity:
          integration: ieast
          domain: media_player
stereo_pair_create:
  name: 创建立体声对
  description: '两台设备组成 L/R 立体声对: 右声道加入左声道分组, 并统一音量、设置声道。'
  fields:
    left:
      name: 左声道(主机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    right:
      name: 右声道(从机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
stereo_pair_remove:
  name: 拆散立体声对
  description: '解除立体声对: 解组并恢复两台设备为立体声输出。'
  fields:
    left:
      name: 左声道(主机)
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    right:
      name: 右声道
      description: 一般可省略, 自动使用配对记录。
      required: false
      selector:
        entity:
          integration: ieast
          domain: media_player
alarm_set:
  name: 闹钟设置
  description: 设置/取消设备闹钟(最多 3 组)。时间为设备侧时间, 先执行'时间同步'按钮校准。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    index:
      name: 闹钟编号(0-2)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 2
    enable:
      name: 启用
      required: false
      default: true
      selector:
        boolean: null
    trigger:
      name: 重复方式
      required: false
      selector:
        select:
          options:
          - label: 单次
            value: once
          - label: 每天
            value: daily
          - label: 每周
            value: weekly
    time:
      name: 时间(HH:MM)
      description: 设备侧时间。
      required: false
      example: 07:30
      selector:
        text: null
    date:
      name: 单次日期(YYYYMMDD)
      description: trigger=once 时必填。
      required: false
      example: '20260924'
      selector:
        text: null
    weekdays:
      name: 周几(0=周日)
      description: trigger=weekly 时生效, 如 [1,2,3,4,5]。
      required: false
      example: '[1,2,3,4,5]'
      selector:
        object: null
    url:
      name: 铃声 URL
      description: 留空为默认铃声。
      required: false
      selector:
        text: null
alarm_get:
  name: 闹钟查询
  description: 查询指定编号闹钟的配置(带响应)。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    index:
      name: 闹钟编号(0-2)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 2
alarm_stop:
  name: 闹钟止铃
  description: 停止当前正在响的闹钟。
  fields:
    entity_id:
      name: 播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
group_volume:
  name: 分组批量音量
  description: 主机+全部从机音量/静音一次到位(带响应, 报告每台结果)。
  fields:
    entity_id:
      name: 主机播放器
      required: true
      selector:
        entity:
          integration: ieast
          domain: media_player
    volume:
      name: 音量(0-100)
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 100
    mute:
      name: 静音
      required: false
      selector:
        boolean: null
